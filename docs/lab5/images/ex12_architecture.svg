<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-labelledby="title desc">
<title id="title">TimeCapsule: архитектура после перехода на Amazon RDS</title>
<desc id="desc">Публичные app-server и bastion в двух зонах, приватная RDS PostgreSQL Single-AZ в eu-central-1a, две подсети в группе базы, приватный DNS Route 53, вложения S3 и ночная остановка через Scheduler с отдельной IAM-ролью. Временные учебные ресурсы удалены.</desc>
