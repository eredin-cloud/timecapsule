<text x="566" y="1185" font-size="17" fill="#526174" font-weight="400" text-anchor="start">lab5-db · lab5-db-replica · lab5-db-restore</text>
<text x="285" y="1210" font-size="15" fill="#657386" font-weight="400" text-anchor="start">Старый db-server на EC2 завершён. Ресурсы приложения, S3 и приватная DNS-зона сохранены.</text>
<text x="42" y="1294" font-size="16" fill="#657386" font-weight="400" text-anchor="start">Сплошные линии — запросы и API; пунктир — администрирование, DNS и прямая загрузка вложений.</text>
<text x="42" y="1320" font-size="16" fill="#657386" font-weight="400" text-anchor="start">RDS и app-server находятся в eu-central-1a: отказ этой зоны требует восстановления и повторного развёртывания приложения.</text>
